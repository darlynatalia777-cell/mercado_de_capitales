name: Actualizar datos de acciones

on:
  workflow_dispatch:
  schedule:
    - cron: "30 22 * * 1-5"

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@v4
      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: python -m pip install --upgrade yfinance pandas
      - name: Descargar datos de mercado
        run: python actualizar_datos.py
      - name: Publicar datos actualizados
        run: |
          if git diff --quiet -- datos.json; then
            echo "No hay cambios en datos.json."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos.json
          git commit -m "Actualizar datos de acciones"
          git push
